<html lang="ko">

<title>천하쟁패</title>

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">

<style>
:root{--bg:#16110c;--panel:#231a12;--panel2:#2e2318;--line:#4a3a28;--gold:#e0b45a;--text:#f3e7cf;--dim:#a8957a;--red:#e8604e;--green:#79c96f;--blue:#6aa8f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer}
b{font-weight:700}
#top{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
#top .date{font-size:13px;color:var(--dim)}
#top .fn{font-weight:800;font-size:16px}
#top .res{margin-left:auto;display:flex;gap:10px;font-size:13px;font-variant-numeric:tabular-nums}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#act{display:flex;gap:8px;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line)}
#act button{flex:1;height:46px;border-radius:12px;font-weight:800;font-size:15px}
.b-auto{background:#3a2d1f;color:var(--gold);border:1px solid var(--gold)!important}
.b-end{background:linear-gradient(#e9c06a,#c8963c);color:#2a1a08}
#nav{display:flex;background:#1c150f;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;height:54px;background:none;color:var(--dim);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#nav button i{font-style:normal;font-size:19px}
#nav button.on{color:var(--gold)}
.map{display:block;width:100%;max-height:52vh;background:radial-gradient(ellipse at 50% 40%,#3b2e1f,#1f1710 75%)}
.map .cn{font-size:10px;fill:#f3e7cf;text-anchor:middle;paint-order:stroke;stroke:#140e08;stroke-width:3px;font-weight:700;pointer-events:none}
.map .cnt{font-size:8px;fill:#d9c7a5;text-anchor:middle;paint-order:stroke;stroke:#140e08;stroke-width:2.5px;pointer-events:none}
.map .ring{fill:none;stroke:#ffe39a;stroke-width:2;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.25}}
.map .bd{font-size:8px;font-weight:800;fill:#fff;text-anchor:middle;pointer-events:none}
.pan{padding:12px}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ch b{font-size:20px}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;color:#111;font-weight:700}
.tag.empty{background:#5a4a38;color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.stats div{background:var(--panel);border-radius:10px;padding:6px 8px;font-size:12px;color:var(--dim)}
.stats b{display:block;color:var(--text);font-size:16px}
.cmds{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.cmds button{background:var(--panel2);border:1px solid var(--line);border-radius:12px;height:54px;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.cmds button i{font-style:normal;font-size:18px}
.cmds button.hot{border-color:var(--gold);color:var(--gold)}
.sec{font-size:13px;color:var(--dim);margin:12px 0 6px;display:flex;justify-content:space-between}
.rumor{font-size:13px;background:#2a2016;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;color:var(--gold);margin-top:8px}
.card{display:flex;gap:10px;align-items:center;background:var(--panel);border-radius:12px;padding:8px 10px;margin-bottom:6px;border:1px solid transparent}
.card.r5{border-color:#e0b45a;background:linear-gradient(90deg,#3a2c14,var(--panel) 60%)}
.card.r4{border-color:#9b6fd6}
.card.off{opacity:.45}
.card.pick{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.ci{flex:1;min-width:0}
.cn1{display:flex;align-items:center;gap:6px}
.cn1 b{font-size:15px}
.st{font-size:11px;letter-spacing:-1px}
.r5 .st,.st.r5{color:#ffd166}.r4 .st,.st.r4{color:#c79bff}.r3 .st,.st.r3{color:#7fb6ff}.r2 .st,.st.r2{color:#8fd18a}.r1 .st,.st.r1{color:#aaa}
.done{font-size:10px;background:#4a3a28;color:var(--dim);padding:1px 6px;border-radius:8px}
.sv{display:flex;gap:8px;font-size:12px;color:var(--dim);margin-top:2px}
.sv b{color:var(--text);margin-left:2px}
.ex{font-size:12px;color:var(--gold);margin-top:2px}
.face{flex:none;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 50%,#000));display:flex;align-items:center;justify-content:center;border:2px solid #5a4630;position:relative}
.face span{font-weight:900;color:#fff;text-shadow:0 1px 2px #000a;font-size:14px;letter-spacing:-1px}
.face.l3 span{font-size:11px}
.face.r5{border-color:#ffd166;box-shadow:0 0 8px #ffd16699}
.face.r4{border-color:#c79bff}
.face.r3{border-color:#7fb6ff}
.face.gray{filter:grayscale(1) brightness(.6)}
.face.unk{background:#2a2016;border-style:dashed}
.face.big{width:96px;height:96px}
.face.big span{font-size:26px}
.hint{padding:20px;text-align:center;color:var(--dim)}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:86dvh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));border-top:2px solid var(--gold);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet .sub{font-size:13px;color:var(--dim);margin-bottom:10px}
.btn{display:block;width:100%;height:48px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:15px;margin-top:8px}
.btn.pri{background:linear-gradient(#e9c06a,#c8963c);color:#2a1a08;border:0}
.btn:disabled{opacity:.4}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}
.citybtn{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px;border-radius:12px;background:var(--panel);margin-bottom:6px;border:1px solid var(--line);font-size:15px}
.citybtn small{color:var(--dim)}
input[type=range]{width:100%;accent-color:var(--gold);height:30px}
.est{text-align:center;font-weight:800;font-size:16px;margin:4px 0}
.blog{font-size:14px;line-height:1.5}
.blog div{padding:4px 0;border-bottom:1px solid #2a2016;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateX(-6px)}}
.blog .h{color:var(--dim);font-size:13px}
.blog .good{color:var(--green);font-weight:700}
.blog .bad{color:var(--red);font-weight:700}
.blog .duel{color:var(--gold);font-weight:800;font-size:15px}
.result{text-align:center;font-size:24px;font-weight:900;margin:10px 0;animation:pop .4s}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.15)}}
#toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
#get{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle,#3a2a10ee,#000e 70%)}
#get.on{display:flex}
#get .rays{position:absolute;width:520px;height:520px;background:repeating-conic-gradient(#ffd16622 0 10deg,transparent 10deg 20deg);animation:spin 12s linear infinite;border-radius:50%;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
#get .gc{position:relative;text-align:center;animation:pop .6s}
#get .gt{font-size:22px;font-weight:900;color:var(--gold);margin-bottom:14px;text-shadow:0 0 12px #ffd16688}
#get .gn{font-size:30px;font-weight:900;margin-top:10px}
#get .gtt{color:var(--dim);font-size:14px}
#get .new{display:inline-block;background:var(--red);color:#fff;font-size:12px;font-weight:800;padding:2px 10px;border-radius:10px;margin-top:8px}
#get .face.big{width:130px;height:130px;margin:0 auto}
#get .face.big span{font-size:34px}
.bars{margin:10px 0}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.bar span{width:30px;color:var(--dim)}
.bar .bg{flex:1;height:10px;background:#2a2016;border-radius:5px;overflow:hidden}
.bar .fg{height:100%;background:linear-gradient(90deg,#c8963c,#ffd166);border-radius:5px}
.bar b{width:28px;text-align:right}
.dexhead{padding:12px}
.prog{height:12px;background:#2a2016;border-radius:6px;overflow:hidden;margin:6px 0 8px}
.prog div{height:100%;background:linear-gradient(90deg,#c8963c,#ffd166)}
.rc{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.rc span{background:var(--panel);padding:3px 8px;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px 12px}
.dx{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--panel);border-radius:12px;padding:8px 2px;font-size:12px}
.dx .face{width:50px;height:50px}
.dx small{font-size:10px;line-height:1}
.sorts{display:flex;gap:6px;padding:10px 12px 4px;overflow-x:auto}
.sorts button{background:var(--panel);padding:6px 12px;border-radius:14px;font-size:13px;white-space:nowrap;color:var(--dim)}
.sorts button.on{background:var(--gold);color:#2a1a08;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{padding:7px 4px;border-bottom:1px solid #2a2016;text-align:center}
.tbl th{color:var(--dim);font-weight:400}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
#title{position:fixed;inset:0;z-index:60;background:radial-gradient(ellipse at 50% 30%,#3b2e1f,#120d08 70%);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px}
#title.on{display:flex}
#title h1{font-size:54px;margin:0;letter-spacing:6px;color:var(--gold);text-shadow:0 2px 0 #6b4a1a,0 0 24px #e0b45a55;font-family:"Batang","AppleMyungjo","Noto Serif KR",serif}
#title p{color:var(--dim);margin:6px 0 40px}
#title .btn{max-width:300px}
.fsel{width:100%;max-width:520px;overflow-y:auto;max-height:80dvh}
.fcard{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;padding:10px;margin-bottom:8px;border:1px solid var(--line);width:100%;text-align:left}
.fcard .fi{flex:1}
.fcard .fi b{font-size:17px}
.fcard .fi div{font-size:12px;color:var(--dim)}
.diff{font-size:12px;font-weight:800;padding:2px 8px;border-radius:8px}
.d1{background:#2f5a2a;color:#bff0b5}.d2{background:#5a4a1a;color:#ffe39a}.d3{background:#5a2020;color:#ffb3a8}
.help p{font-size:14px;line-height:1.6;margin:6px 0}
.help b{color:var(--gold)}
</style>
</head>

const TITLES={조조:'난세의 간웅',유비:'인덕의 군주',관우:'미염공',장비:'연인 장익덕',조운:'상산의 조자룡',제갈량:'와룡',방통:'봉추',여포:'비장',마초:'금마초',황충:'노익장',주유:'미주랑',손책:'소패왕',전위:'고대의 악래',허저:'호치',사마의:'총달',곽가:'귀재',장료:'요래래',감녕:'금범적',순욱:'왕좌지재',가후:'독사',육손:'서생 대도독',강유:'기린아',서서:'단복',손권:'벽안아',태사자:'신의의 사',노숙:'동오의 기둥',서황:'주아부의 기풍',등애:'말더듬이 명장',하후돈:'맹하후'};
// 흠모하는 군주 (그 군주로 플레이하면 등용이 쉬워짐)
const FAV={조운:'유비',제갈량:'유비',방통:'유비',서서:'유비',마초:'유비',황충:'유비',위연:'유비',마량:'유비',진등:'유비',
  허저:'조조',순유:'조조',사마의:'조조',장료:'조조',서황:'조조',전예:'조조',
  육손:'손책',여몽:'손책',노숙:'손책',감녕:'손책',
  고순:'여포',진궁:'여포'};
const TOTAL=GENS.split('\n').length;

/* ===================== 유틸 ===================== */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>Math.round(n).toLocaleString();
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
function j(w,a,b){const c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return w+b;return w+(((c-0xAC00)%28)?a:b);}
const ADJ={};EDGES.forEach(([a,b])=>{(ADJ[a]=ADJ[a]||[]).push(b);(ADJ[b]=ADJ[b]||[]).push(a);});

let S=null;
const UI={tab:'map',sel:null,sort:'r',lock:false,war:null,mv:null};
const SAVE='chunha_samguk_v1';
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
function loadSave(){try{const t=localStorage.getItem(SAVE);return t?JSON.parse(t):null}catch(e){return null}}

const G=()=>Object.values(S.gens);
function gensAt(c,st,f){return G().filter(g=>g.city===c&&g.status===st&&(f===undefined||g.force===f))}
function myGens(){return G().filter(g=>g.force===S.player&&g.status==='serve')}
function citiesOf(f){return Object.values(S.cities).filter(c=>c.owner===f)}
function isRuler(g){return !!(g.force&&S.forces[g.force]&&S.forces[g.force].ruler===g.id)}
function idleIn(cid){return gensAt(cid,'serve',S.player).filter(g=>!g.acted)}
function total(g){return g.war+g.int+g.lead+g.cha}
function rarity(g){const t=total(g),m=Math.max(g.war,g.int,g.lead,g.cha);if(m>=97||t>=330)return 5;if(m>=93||t>=290)return 4;if(t>=250)return 3;if(t>=200)return 2;return 1;}
function stars(r){return '★'.repeat(r)}
function maxBy(a,k){return a.reduce((m,g)=>g[k]>m[k]?g:m,a[0])}
function power(gs){if(!gs.length)return 25;return maxBy(gs,'lead').lead*.5+maxBy(gs,'war').war*.3+maxBy(gs,'int').int*.2}
function colorOf(g){return g.force?S.forces[g.force].color:'#8b7355'}

/* ===================== 그리기 조각 ===================== */
function face(g,cls=''){
  const r=rarity(g);
  return `<div class="face r${r} ${g.name.length>2?'l3':''} ${cls}" style="--c:${colorOf(g)}"><span>${g.name}</span></div>`;
}
function card(g,extra='',onclick='',cls=''){
  const r=rarity(g);
  const done=g.status==='serve'&&g.force===S.player&&g.acted;
  return `<div class="card r${r} ${cls}" ${onclick?`onclick="${onclick}"`:''}>${face(g)}<div class="ci">
    <div class="cn1"><b>${g.name}</b><span class="st">${stars(r)}</span>${done?'<span class="done">행동완료</span>':''}</div>
    <div class="sv"><span>무<b>${g.war}</b></span><span>지<b>${g.int}</b></span><span>통<b>${g.lead}</b></span><span>매<b>${g.cha}</b></span></div>
    ${extra?`<div class="ex">${extra}</div>`:''}</div></div>`;
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200);}
function openModal(h){const m=$('#modal');m.innerHTML=`<div class="sheet">${h}</div>`;m.classList.add('on');}
function closeModal(){$('#modal').classList.remove('on');UI.lock=false;}

/* ===================== 새 게임 ===================== */
function newGame(pf){
  S={year:196,month:1,turn:0,player:pf,forces:{},cities:{},gens:{},dex:[]};
  for(const k in FORCES){const [color,ruler]=FORCES[k];S.forces[k]={name:k,color,ruler,alive:true,gold:k===pf?1500:1000,food:8000};}
  for(const k in CITIES){const [x,y,o,t,a,c]=CITIES[k];S.cities[k]={id:k,x,y,owner:o,troops:t,agri:a,comm:c};}
  GENS.split('\n').forEach(line=>{const [n,w,i,l,ch,f,c,st]=line.trim().split(',');
    S.gens[n]={id:n,name:n,war:+w,int:+i,lead:+l,cha:+ch,force:f==='-'?null:f,city:c,status:{s:'serve',h:'hidden',f:'free'}[st],acted:false,visits:0,prev:null};});
  myGens().forEach(g=>S.dex.push(g.id));
  UI.sel=FORCES[pf][2];UI.tab='map';
  $('#title').classList.remove('on');
  save();render();
  setTimeout(()=>openHelp(true),250);
}
function forceInfo(f){
  const gs=GENS.split('\n').map(l=>l.split(',')).filter(a=>a[5]===f);
  const cs=Object.values(CITIES).filter(c=>c[2]===f);
  return {gens:gs.length,cities:cs.length,troops:sum(cs,c=>c[3]),score:sum(gs,a=>+a[1]+ +a[2]+ +a[3]+ +a[4])+sum(cs,c=>c[3])/30};
}
function showTitle(){
  const has=!!loadSave();
  const t=$('#title');t.classList.add('on');
  t.innerHTML=`<h1>天下爭霸</h1><p>천하쟁패 · 나만의 삼국지</p>
    <button class="btn pri" onclick="showSelect()">새 게임</button>
    ${has?'<button class="btn" onclick="continueGame()">이어하기</button>':''}`;
}
function continueGame(){S=loadSave();$('#title').classList.remove('on');if(!UI.sel)UI.sel=FORCES[S.player][2];render();}
function showSelect(){
  const list=Object.keys(FORCES).map(f=>({f,...forceInfo(f)})).sort((a,b)=>b.score-a.score);
  const t=$('#title');
  t.innerHTML=`<h3 style="margin:0 0 4px">군주를 선택하세요</h3><div style="color:var(--dim);font-size:13px;margin-bottom:12px">서기 196년 · 군웅할거</div>
  <div class="fsel">${list.map((x,i)=>{
    const d=i<3?'<span class="diff d1">쉬움</span>':i<7?'<span class="diff d2">보통</span>':'<span class="diff d3">어려움</span>';
    const [c,r,home]=FORCES[x.f];
    return `<button class="fcard" onclick="newGame('${x.f}')"><div class="face" style="--c:${c}"><span>${r}</span></div>
      <div class="fi"><b>${x.f}군</b> ${d}${x.f==='유비'?' <span class="diff d2">인재 수집 추천</span>':''}
      <div>본거지 ${home} · 도시 ${x.cities} · 장수 ${x.gens} · 병력 ${fmt(x.troops)}</div></div></button>`;}).join('')}</div>
  <button class="btn" style="max-width:520px" onclick="showTitle()">뒤로</button>`;
}

/* ===================== 화면 ===================== */
function tab(t){UI.tab=t;render();$('#view').scrollTop=0;}
function render(){
  if(!S)return;
  const F=S.forces[S.player];
  $('#top').innerHTML=`<div><div class="date">${S.year}년 ${S.month}월</div><div class="fn" style="color:${F.color}">${S.player}군</div></div>
    <div class="res"><span>💰${fmt(F.gold)}</span><span>🌾${fmt(F.food)}</span><span>📜${S.dex.length}/${TOTAL}</span></div>`;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===UI.tab));
  const v=$('#view');
  if(UI.tab==='map')v.innerHTML=mapSVG()+`<div class="pan">${cityPanel()}</div>`;
  else if(UI.tab==='gens')v.innerHTML=gensTab();
  else if(UI.tab==='dex')v.innerHTML=dexTab();
  else v.innerHTML=menuTab();
}
function mapSVG(){
  let s=`<svg viewBox="0 0 340 338" class="map">
  <path d="M20,108 C70,96 120,118 160,110 S240,96 330,112" fill="none" stroke="#3d6a8a" stroke-width="5" opacity=".5"/>
  <path d="M20,236 C70,250 120,268 170,270 S260,236 336,240" fill="none" stroke="#3d6a8a" stroke-width="6" opacity=".5"/>
  <text x="322" y="104" font-size="8" fill="#6f9cbf" text-anchor="end">황하</text>
  <text x="328" y="232" font-size="8" fill="#6f9cbf" text-anchor="end">장강</text>`;
  EDGES.forEach(([a,b])=>{const A=S.cities[a],B=S.cities[b];s+=`<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#6b5538" stroke-width="1.5" stroke-dasharray="3 3"/>`;});
  Object.values(S.cities).forEach(c=>{
    const col=c.owner?S.forces[c.owner].color:'#5a4a38';const mine=c.owner===S.player;
    const idle=mine?idleIn(c.id).length:0;
    const talent=gensAt(c.id,'free').length+gensAt(c.id,'prisoner').length;
    s+=`<g onclick="selCity('${c.id}')">`;
    if(UI.sel===c.id)s+=`<circle cx="${c.x}" cy="${c.y}" r="16" class="ring"/>`;
    s+=`<circle cx="${c.x}" cy="${c.y}" r="18" fill="transparent"/>`;
    s+=`<circle cx="${c.x}" cy="${c.y}" r="${mine?11:9}" fill="${col}" stroke="${mine?'#ffe39a':'#140e08'}" stroke-width="2"/>`;
    s+=`<text x="${c.x}" y="${c.y+21}" class="cn">${c.id}</text>`;
    s+=`<text x="${c.x}" y="${c.y+30}" class="cnt">${(c.troops/1000).toFixed(1)}k</text>`;
    if(idle)s+=`<circle cx="${c.x+10}" cy="${c.y-9}" r="6" fill="#e8604e"/><text x="${c.x+10}" y="${c.y-6}" class="bd">${idle}</text>`;
    if(talent)s+=`<text x="${c.x-11}" y="${c.y-6}" font-size="11" fill="#ffd166" text-anchor="middle" style="pointer-events:none">★</text>`;
    s+='</g>';
  });
  return s+'</svg>';
}
function selCity(id){UI.sel=id;render();}
function cityPanel(){
  const c=S.cities[UI.sel];if(!c)return '<div class="hint">지도에서 도시를 눌러보세요</div>';
  const mine=c.owner===S.player;
  const own=c.owner?`<span class="tag" style="background:${S.forces[c.owner].color}">${c.owner}군</span>`:'<span class="tag empty">공백지 · 의용군</span>';
  const serve=c.owner?gensAt(c.id,'serve',c.owner):[];
  const free=gensAt(c.id,'free'),pris=gensAt(c.id,'prisoner'),hid=gensAt(c.id,'hidden').length;
  let h=`<div class="ch"><b>${c.id}</b>${own}</div>
  <div class="stats"><div>병력<b>${fmt(c.troops)}</b></div><div>농업<b>${c.agri}</b></div><div>상업<b>${c.comm}</b></div></div>`;
  if(mine){
    const idle=idleIn(c.id).length;
    h+=`<div class="cmds">
      <button onclick="cmdDev('agri')"><i>🌾</i>농업</button>
      <button onclick="cmdDev('comm')"><i>💰</i>상업</button>
      <button onclick="cmdDraft()"><i>🛡️</i>징병</button>
      <button onclick="cmdSearch()" class="${hid?'hot':''}"><i>🔍</i>탐색</button>
      <button onclick="cmdRecruit()" class="${free.length+pris.length?'hot':''}"><i>🤝</i>등용</button>
      <button onclick="cmdMove()"><i>🚶</i>이동</button>
      <button onclick="cmdWar()"><i>⚔️</i>출진</button>
      <button onclick="showGen(null)" style="visibility:hidden"></button>
    </div>
    <div class="rumor">${hid?`🔍 이 고을에 숨은 인재가 있다는 소문이 있다 (${hid}명)`:'이 고을에는 더 이상 숨은 인재 소문이 없다'}</div>`;
    h+=`<div class="sec"><span>장수 ${serve.length}명</span><span>행동 가능 ${idle}</span></div>`;
  }else{
    h+=`<div class="sec"><span>${c.owner?'장수 '+serve.length+'명':'주둔 장수 없음'}</span></div>`;
  }
  h+=serve.sort((a,b)=>a.acted-b.acted||total(b)-total(a)).map(g=>card(g,isRuler(g)?'👑 군주':'',`showGen('${g.id}')`)).join('');
  if(free.length)h+=`<div class="sec"><span>⭐ 재야 인재</span><span>${mine?'등용 가능':'이 도시를 차지하면 등용 가능'}</span></div>`+free.map(g=>card(g,TITLES[g.name]||'재야',`showGen('${g.id}')`)).join('');
  if(pris.length)h+=`<div class="sec"><span>⛓️ 포로</span><span>${mine?'등용 가능':''}</span></div>`+pris.map(g=>card(g,'포로'+(g.prev?' (전 '+g.prev+'군)':''),`showGen('${g.id}')`)).join('');
  return h;
}
function gensTab(){
  const sorts=[['r','등급'],['war','무력'],['int','지력'],['lead','통솔'],['cha','매력'],['city','도시']];
  let gs=myGens();
  const k=UI.sort;
  gs.sort((a,b)=>k==='r'?(rarity(b)-rarity(a)||total(b)-total(a)):k==='city'?a.city.localeCompare(b.city):b[k]-a[k]);
  return `<div class="sorts">${sorts.map(([s,n])=>`<button class="${UI.sort===s?'on':''}" onclick="UI.sort='${s}';render()">${n}</button>`).join('')}</div>
  <div class="pan"><div class="sec"><span>보유 장수 ${gs.length}명</span><span>행동 가능 ${gs.filter(g=>!g.acted).length}</span></div>
  ${gs.map(g=>card(g,`📍 ${g.city}${isRuler(g)?' · 👑 군주':''}`,`showGen('${g.id}')`)).join('')||'<div class="hint">장수가 없습니다</div>'}</div>`;
}
function dexTab(){
  const all=G().slice().sort((a,b)=>rarity(b)-rarity(a)||total(b)-total(a));
  const cnt=[5,4,3,2,1].map(r=>{const a=all.filter(g=>rarity(g)===r);return `<span class="st r${r}">${stars(r)} ${a.filter(g=>S.dex.includes(g.id)).length}/${a.length}</span>`;}).join('');
  return `<div class="dexhead"><b>장수 도감</b> <span style="color:var(--dim)">${S.dex.length} / ${TOTAL}</span>
  <div class="prog"><div style="width:${S.dex.length/TOTAL*100}%"></div></div><div class="rc">${cnt}</div></div>
  <div class="grid">${all.map(g=>{
    const own=S.dex.includes(g.id),known=own||g.status!=='hidden';const r=rarity(g);
    if(!known)return `<div class="dx"><div class="face unk r${r}"><span>?</span></div><span>???</span><small class="st r${r}">${stars(r)}</small></div>`;
    return `<div class="dx" onclick="showGen('${g.id}')">${face(g,own?'':'gray')}<span style="${own?'':'color:var(--dim)'}">${g.name}</span><small class="st r${r}">${stars(r)}</small></div>`;
  }).join('')}</div>`;
}
function menuTab(){
  const rows=Object.values(S.forces).filter(f=>f.alive).map(f=>{const cs=citiesOf(f.name);
    return `<tr><td style="text-align:left"><span class="dot" style="background:${f.color}"></span>${f.name}</td><td>${cs.length}</td><td>${G().filter(g=>g.force===f.name&&g.status==='serve').length}</td><td>${fmt(sum(cs,c=>c.troops))}</td></tr>`;}).join('');
  const dead=Object.values(S.forces).filter(f=>!f.alive).map(f=>f.name).join(', ');
  return `<div class="pan"><div class="sec"><span>세력 현황</span><span>${S.year}년 ${S.month}월</span></div>
  <table class="tbl"><tr><th style="text-align:left">세력</th><th>도시</th><th>장수</th><th>병력</th></tr>${rows}</table>
  ${dead?`<div class="sec"><span>멸망: ${dead}</span></div>`:''}
  <button class="btn" onclick="openHelp()">📖 게임 방법</button>
  <button class="btn" onclick="if(confirm('지금 게임을 버리고 새로 시작할까요?'))showSelect(),$('#title').classList.add('on')">🔄 새 게임</button>
  <div class="hint" style="font-size:12px">행동할 때마다 자동 저장됩니다.<br>천하쟁패 v1</div></div>`;
}
function showGen(id){
  if(!id)return;const g=S.gens[id];const r=rarity(g);
  const bar=(n,v)=>`<div class="bar"><span>${n}</span><div class="bg"><div class="fg" style="width:${v}%"></div></div><b>${v}</b></div>`;
  const st=g.status==='serve'?`${g.force}군 · ${g.city}${isRuler(g)?' · 군주':''}`:g.status==='free'?`재야 · ${g.city}`:g.status==='prisoner'?`포로 · ${g.city}`:'행방 불명';
  const mineCity=S.cities[g.city]&&S.cities[g.city].owner===S.player;
  openModal(`<div style="display:flex;gap:14px;align-items:center">${face(g,'big')}<div>
    <h3>${g.name} <span class="st r${r}">${stars(r)}</span></h3><div class="sub">${TITLES[g.name]||''}</div>
    <div style="font-size:13px">${st}</div>${FAV[g.name]?`<div style="font-size:12px;color:var(--gold)">흠모: ${FAV[g.name]}</div>`:''}
    ${S.dex.includes(g.id)?'<div style="font-size:12px;color:var(--green)">📜 도감 등록됨</div>':''}</div></div>
    <div class="bars">${bar('무력',g.war)}${bar('지력',g.int)}${bar('통솔',g.lead)}${bar('매력',g.cha)}</div>
    ${(g.status==='free'||g.status==='prisoner')&&mineCity?`<button class="btn pri" onclick="closeModal();UI.sel='${g.city}';UI.tab='map';cmdRecruit('${g.id}')">🤝 등용하러 가기</button>`:''}
    <div class="row2"><button class="btn" onclick="closeModal();UI.sel='${g.city}';tab('map')">📍 ${g.city} 보기</button><button class="btn" onclick="closeModal()">닫기</button></div>`);
}

/* ===================== 고르기 창 ===================== */
let PK=null,PL=[];
function pk(i){const f=PK,x=PL[i];PK=null;closeModal();f&&f(x);}
function chooseGen(list,title,sub,cb,info=''){
  PK=cb;PL=list;
  openModal(`<h3>${title}</h3>${info?`<div class="sub">${info}</div>`:''}${list.map((g,i)=>card(g,sub?sub(g):'',`pk(${i})`)).join('')}<button class="btn" onclick="closeModal()">취소</button>`);
}
function chooseCity(list,title,sub,cb){
  PK=cb;PL=list;
  openModal(`<h3>${title}</h3>${list.map((id,i)=>{const c=S.cities[id];return `<button class="citybtn" onclick="pk(${i})"><span>${c.owner?`<span class="dot" style="background:${S.forces[c.owner].color}"></span>`:''}<b>${id}</b> <small>${c.owner?c.owner+'군':'공백지'}</small></span><small>${sub(c)}</small></button>`;}).join('')}<button class="btn" onclick="closeModal()">취소</button>`);
}

/* ===================== 내정 명령 ===================== */
function curCity(){return S.cities[UI.sel]}
function after(){save();render();}
function needIdle(c){const idle=idleIn(c.id);if(!idle.length){toast('이번 달 행동 가능한 장수가 없습니다');return null}return idle;}
function devAmt(g){return Math.round(g.int/6+ri(4,8))}
function draftAmt(g){return Math.round(400+g.cha*4+g.lead*4)}
function doDev(g,c,k){const v=Math.min(999-c[k],devAmt(g));c[k]+=v;S.forces[S.player].gold-=50;g.acted=true;return v;}
function doDraft(g,c){const v=Math.min(30000-c.troops,draftAmt(g));c.troops+=v;S.forces[S.player].gold-=100;g.acted=true;return v;}
function searchChance(g){return Math.min(.9,.35+g.int/250)}
function doSearch(g,c){
  g.acted=true;const hid=gensAt(c.id,'hidden');
  if(hid.length&&Math.random()<searchChance(g)){const t=pick(hid);t.status='free';return {found:t};}
  if(Math.random()<.4){const v=ri(50,150);S.forces[S.player].gold+=v;return {gold:v};}
  return {};
}
function cmdDev(k){
  const c=curCity(),idle=needIdle(c);if(!idle)return;
  if(S.forces[S.player].gold<50)return toast('금이 부족합니다 (50 필요)');
  if(c[k]>=999)return toast('이미 최대치입니다');
  const n=k==='agri'?'농업':'상업';
  chooseGen(idle.sort((a,b)=>b.int-a.int),`${n} 개발 · 금 50`,g=>`지력 ${g.int} → 약 +${Math.round(g.int/6+6)}`,g=>{
    const v=doDev(g,c,k);toast(`${g.name}: ${n} +${v}`);after();},'지력이 높을수록 효과가 큽니다');
}
function cmdDraft(){
  const c=curCity(),idle=needIdle(c);if(!idle)return;
  if(S.forces[S.player].gold<100)return toast('금이 부족합니다 (100 필요)');
  if(c.troops>=30000)return toast('병력이 가득 찼습니다');
  chooseGen(idle.sort((a,b)=>draftAmt(b)-draftAmt(a)),'징병 · 금 100',g=>`매력+통솔 → 약 +${fmt(draftAmt(g))}명`,g=>{
    const v=doDraft(g,c);toast(`${g.name}: 병사 ${fmt(v)}명 모집`);after();},'매력과 통솔이 높을수록 많이 모입니다');
}
function cmdSearch(){
  const c=curCity(),idle=needIdle(c);if(!idle)return;
  const hid=gensAt(c.id,'hidden').length;
  chooseGen(idle.sort((a,b)=>b.int-a.int),'인재 탐색',g=>hid?`지력 ${g.int} · 발견 확률 ${Math.round(searchChance(g)*100)}%`:`지력 ${g.int}`,g=>{
    const r=doSearch(g,c);after();
    if(r.found)showFound(r.found,g);
    else if(r.gold)toast(`${g.name}: 인재는 못 찾았지만 금 ${r.gold}을 얻었다`);
    else toast(`${g.name}: 아무것도 찾지 못했다…`);
  },hid?`숨은 인재 소문 ${hid}명`:'숨은 인재 소문이 없습니다. 금을 줍는 정도일 거예요.');
}
function showFound(t,g){
  const r=rarity(t);const more=idleIn(t.city).length;
  if(navigator.vibrate)navigator.vibrate(r>=4?[60,40,120]:40);
  openModal(`<h3>🔍 재야 인재 발견!</h3><div class="sub">${j(g.name,'이','가')} ${t.city}에서 인재를 찾아냈다</div>
    ${card(t,TITLES[t.name]||'재야')}${FAV[t.name]?`<div class="sub">${j(t.name,'은','는')} ${j(FAV[t.name],'을','를')} 흠모한다고 한다</div>`:''}
    ${more?`<button class="btn pri" onclick="closeModal();cmdRecruit('${t.id}')">🤝 바로 등용 시도</button>`:'<div class="sub">이번 달은 남은 장수가 없어요. 다음 달에 등용해 보세요.</div>'}
    <button class="btn" onclick="closeModal()">닫기</button>`);
}
function recruitChance(rec,t){
  let p=.35+(rec.cha-60)/100-(rarity(t)-1)*.07+t.visits*.08;
  if(t.status==='prisoner')p+=.1;
  if(rec.id===S.forces[S.player].ruler)p+=.1;
  if(FAV[t.name]===S.forces[S.player].ruler)p+=.25;
  return clamp(p,.05,.95);
}
function cmdRecruit(tid){
  const c=curCity();
  const tg=[...gensAt(c.id,'free'),...gensAt(c.id,'prisoner')];
  if(!tg.length)return toast('이 도시에 등용할 인재가 없습니다. 먼저 탐색해 보세요');
  const idle=needIdle(c);if(!idle)return;
  const go=t=>chooseGen(idle.sort((a,b)=>recruitChance(b,t)-recruitChance(a,t)),`${t.name} 등용 — 누구를 보낼까?`,g=>`매력 ${g.cha} · 성공 ${Math.round(recruitChance(g,t)*100)}%`,g=>tryRecruit(g,t),
    `${stars(rarity(t))} 등급이 높을수록 어렵고, 실패할 때마다 다음 확률이 올라갑니다${t.visits?` (방문 ${t.visits}회)`:''}`);
  if(tid&&S.gens[tid]&&tg.includes(S.gens[tid]))return go(S.gens[tid]);
  if(tg.length===1)return go(tg[0]);
  chooseGen(tg,'누구를 등용할까?',t=>t.status==='prisoner'?'⛓️ 포로':'⭐ 재야',go);
}
const FAILS=['아직 때가 아닌 듯하오.','그대의 주군을 좀 더 지켜보겠소.','미안하오, 마음이 내키지 않소.','…(묵묵부답)','다음에 다시 오시오.'];
function tryRecruit(g,t){
  g.acted=true;
  if(Math.random()<recruitChance(g,t)){const isNew=join(t,S.player);t.city=g.city;after();showGet(t,isNew);}
  else{
    t.visits++;after();
    const msg=t.name==='제갈량'?`제갈량은 집을 비웠다… (방문 ${t.visits}회)`:t.status==='prisoner'?'내 어찌 두 주군을 섬기겠는가!':pick(FAILS);
    openModal(`<h3>등용 실패</h3>${card(t)}<div class="sub" style="font-size:15px;color:var(--text)">${t.name}: "${msg}"</div><div class="sub">다음 달에 다시 찾아가면 확률이 올라갑니다 (+8%)</div><button class="btn" onclick="closeModal()">확인</button>`);
  }
}
function join(g,f){
  g.force=f;g.status='serve';g.acted=true;g.visits=0;
  if(f===S.player&&!S.dex.includes(g.id)){S.dex.push(g.id);return true;}
  return false;
}
function showGet(g,isNew){
  const r=rarity(g);
  if(navigator.vibrate)navigator.vibrate(r>=5?[80,50,80,50,200]:r>=4?[60,40,120]:50);
  const t=r>=5?'✨ 전설의 장수 등용! ✨':r>=4?'명장 등용!':'장수 등용';
  $('#get').innerHTML=`${r>=4?'<div class="rays"></div>':''}<div class="gc"><div class="gt">${t}</div>${face(g,'big')}
    <div class="gn">${g.name}</div><div class="st r${r}" style="font-size:20px">${stars(r)}</div><div class="gtt">${TITLES[g.name]||''}</div>
    <div class="sv" style="justify-content:center;font-size:14px;margin-top:8px"><span>무<b>${g.war}</b></span><span>지<b>${g.int}</b></span><span>통<b>${g.lead}</b></span><span>매<b>${g.cha}</b></span></div>
    ${isNew?'<div class="new">NEW · 도감 등록</div>':''}<div style="color:var(--dim);font-size:12px;margin-top:20px">화면을 누르면 닫힙니다</div></div>`;
  $('#get').classList.add('on');
}
function closeGet(){$('#get').classList.remove('on');}

/* ===================== 이동 ===================== */
function cmdMove(){
  const c=curCity(),idle=needIdle(c);if(!idle)return;
  const dests=ADJ[c.id].filter(n=>S.cities[n].owner===S.player);
  if(!dests.length)return toast('인접한 아군 도시가 없습니다');
  chooseGen(idle,'누구를 이동시킬까?',g=>'',g=>{
    UI.mv={g:g.id,from:c.id,to:dests[0],troops:0};renderMove();
  },'병력을 함께 옮길 수 있습니다');
}
function renderMove(){
  const m=UI.mv,c=S.cities[m.from],g=S.gens[m.g];
  openModal(`<h3>${g.name} 이동</h3><div class="sub">${m.from}에서 출발</div>
  ${ADJ[m.from].filter(n=>S.cities[n].owner===S.player).map(n=>`<button class="citybtn" style="${m.to===n?'border-color:var(--gold)':''}" onclick="UI.mv.to='${n}';renderMove()"><b>${n}</b><small>병력 ${fmt(S.cities[n].troops)} · 장수 ${gensAt(n,'serve',S.player).length}</small></button>`).join('')}
  <div class="sec"><span>함께 옮길 병력</span><b id="mvt">${fmt(m.troops)}</b></div>
  <input type="range" min="0" max="${c.troops}" step="100" value="${m.troops}" oninput="UI.mv.troops=+this.value;$('#mvt').textContent=fmt(this.value)">
  <button class="btn pri" onclick="doMove()">이동</button><button class="btn" onclick="closeModal()">취소</button>`);
}
function doMove(){
  const m=UI.mv,g=S.gens[m.g],a=S.cities[m.from],b=S.cities[m.to];
  const t=Math.min(m.troops,a.troops);a.troops-=t;b.troops=Math.min(30000,b.troops+t);
  g.city=m.to;g.acted=true;closeModal();toast(`${j(g.name,'이','가')} ${j(m.to,'으로','로')} 이동했다`);after();
}

/* ===================== 출진 ===================== */
function cmdWar(){
  const c=curCity(),idle=needIdle(c);if(!idle)return;
  const tg=ADJ[c.id].filter(n=>S.cities[n].owner!==S.player);
  if(!tg.length)return toast('인접한 적 도시가 없습니다');
  if(c.troops<500)return toast('병력이 부족합니다 (최소 500)');
  chooseCity(tg,'어디를 공격할까?',t=>`병력 ${fmt(t.troops)} · 장수 ${t.owner?gensAt(t.id,'serve',t.owner).length:0}`,tid=>{
    const best=idle.slice().sort((a,b)=>power([b])-power([a])).slice(0,3).map(g=>g.id);
    UI.war={from:c.id,to:tid,sel:best,troops:Math.floor(c.troops*.8/100)*100};renderWar();
  });
}
function warEst(){
  const w=UI.war,T=S.cities[w.to];const A=w.sel.map(i=>S.gens[i]);const D=T.owner?gensAt(T.id,'serve',T.owner):[];
  if(!A.length)return ['장수를 1명 이상 고르세요','var(--dim)'];
  const r=(w.troops*power(A))/((T.troops||1)*1.15*power(D)+1);
  return r>1.7?['예상: 압도적 우세','var(--green)']:r>1.2?['예상: 우세','var(--green)']:r>.9?['예상: 백중세','var(--gold)']:['예상: 열세','var(--red)'];
}
function renderWar(){
  const w=UI.war,c=S.cities[w.from],T=S.cities[w.to];const idle=idleIn(c.id);
  const D=T.owner?gensAt(T.id,'serve',T.owner):[];const e=warEst();
  openModal(`<h3>⚔️ ${w.from} → ${w.to}</h3>
  <div class="sub">${T.owner?T.owner+'군':'의용군'} 병력 ${fmt(T.troops)} · 수비 장수: ${D.map(g=>g.name).join(', ')||'없음'}</div>
  <div class="sec"><span>출진 장수 (최대 3명)</span><span>${w.sel.length}/3</span></div>
  ${idle.map(g=>card(g,'',`warToggle('${g.id}')`,w.sel.includes(g.id)?'pick':(w.sel.length>=3?'off':''))).join('')}
  <div class="sec"><span>출진 병력 (최대 ${fmt(c.troops)})</span><b id="wt">${fmt(w.troops)}</b></div>
  <input type="range" min="100" max="${c.troops}" step="100" value="${w.troops}" oninput="UI.war.troops=+this.value;$('#wt').textContent=fmt(this.value);const e=warEst();$('#we').textContent=e[0];$('#we').style.color=e[1]">
  <div class="est" id="we" style="color:${e[1]}">${e[0]}</div>
  ${gensAt(c.id,'serve',S.player).length-w.sel.length<=0?`<div class="sub" style="color:var(--red);text-align:center">⚠ ${c.id}에 남는 장수가 없어요. 비어 있으면 적의 표적이 됩니다</div>`:''}
  <button class="btn pri" onclick="warGo()" ${w.sel.length?'':'disabled'}>출진!</button><button class="btn" onclick="closeModal()">취소</button>`);
}
function warToggle(id){const s=UI.war.sel;const i=s.indexOf(id);if(i>=0)s.splice(i,1);else if(s.length<3)s.push(id);renderWar();}
function warGo(){
  const w=UI.war,c=S.cities[w.from];if(!w.sel.length)return;
  const t=Math.min(w.troops,c.troops);c.troops-=t;
  w.sel.forEach(i=>S.gens[i].acted=true);
  const res=battle(S.player,w.from,w.to,w.sel,t);
  if(res.win)UI.sel=w.to;
  save();render();playBattle(res);
}

/* ===================== 전투 ===================== */
function battle(af,from,to,ids,troops){
  const T=S.cities[to],df=T.owner,A=ids.map(i=>S.gens[i]);
  const D=df?gensAt(to,'serve',df):[];
  let at=troops,dt=T.troops;
  const L=[],res={af,df,from,to,L,captured:[],fled:[],lost:[],freed:[],win:false};
  const an=af+'군',dn=df?df+'군':'의용군';
  L.push([`${an} ${fmt(at)}명 (${A.map(g=>g.name).join('·')}) 출진!`,'h']);
  L.push([`${dn} ${fmt(dt)}명${D.length?' ('+D.slice(0,4).map(g=>g.name).join('·')+(D.length>4?' 외':'')+')':''} 수비`,'h']);
  const ap=power(A),dp=power(D);
  if(D.length&&dt>0&&Math.random()<.45){
    const wa=maxBy(A,'war'),wd=maxBy(D,'war');
    L.push([`⚔ 일기토! ${wa.name}(무${wa.war}) vs ${wd.name}(무${wd.war})`,'duel']);
    if(Math.random()<clamp(.5+(wa.war-wd.war)/30,.08,.92)){dt=Math.floor(dt*.82);L.push([`${j(wa.name,'이','가')} ${j(wd.name,'을','를')} 물리쳤다! 수비군 사기 저하`,'A']);}
    else{at=Math.floor(at*.82);L.push([`${j(wd.name,'이','가')} ${j(wa.name,'을','를')} 물리쳤다! 공격군 사기 저하`,'D']);}
  }
  const ia=maxBy(A,'int'),id=D.length?maxBy(D,'int'):null;
  for(let r=1;r<=8&&at>0&&dt>0;r++){
    if(Math.random()<.25){
      if(!id||ia.int>=id.int){if(Math.random()<(id?.4+(ia.int-id.int)/50:.6)){const d=Math.floor(dt*rnd(.08,.16));dt-=d;L.push([`🔥 ${ia.name}의 계략! 수비군 ${fmt(d)} 피해`,'A']);}}
      else if(Math.random()<.4+(id.int-ia.int)/50){const d=Math.floor(at*rnd(.08,.16));at-=d;L.push([`🔥 ${id.name}의 계략! 공격군 ${fmt(d)} 피해`,'D']);}
    }
    const da=Math.floor(at*.13*ap/dp*rnd(.85,1.15)),dd=Math.floor(dt*.13*dp*1.15/ap*rnd(.85,1.15));
    dt=Math.max(0,dt-da);at=Math.max(0,at-dd);
    L.push([`${r}합 — 공격 ${fmt(at)} · 수비 ${fmt(dt)}`,'']);
  }
  res.win=at>0&&(dt<=0||dt<at*.25);
  if(res.win){
    if(dt>0)L.push(['수비군이 성을 버리고 달아났다!','A']);
    T.owner=af;T.troops=at;T.agri=Math.floor(T.agri*.9);T.comm=Math.floor(T.comm*.9);
    A.forEach(g=>g.city=to);
    const others=df?citiesOf(df):[];
    D.forEach(g=>{
      if(others.length&&(isRuler(g)||Math.random()<.5)){g.city=pick(others).id;res.fled.push(g.name);}
      else{g.status='prisoner';g.prev=df;g.force=null;res.captured.push(g.name);}
    });
    gensAt(to,'prisoner').forEach(g=>{if(g.prev===af){join(g,af);res.freed.push(g.name);}});
    L.push([`🏯 ${j(an,'이','가')} ${j(to,'을','를')} 점령했다!`,'A']);
    if(res.captured.length)L.push([`⛓️ 포로: ${res.captured.join(', ')}`,'A']);
    if(res.fled.length)L.push([`도주: ${res.fled.join(', ')}`,'']);
    if(res.freed.length)L.push([`붙잡혀 있던 ${res.freed.join(', ')} 구출!`,'A']);
    if(df&&!others.length){eliminate(df);L.push([`💀 ${df}군 멸망!`,'A']);res.destroyed=df;}
  }else{
    S.cities[from].troops+=at;T.troops=dt;
    A.forEach(g=>{if(!isRuler(g)&&D.length&&Math.random()<.15){g.status='prisoner';g.prev=af;g.force=null;g.city=to;res.lost.push(g.name);}});
    L.push([`${an} 퇴각…`,'D']);
    if(res.lost.length)L.push([`⛓️ ${res.lost.join(', ')} 포로로 잡힘`,'D']);
  }
  return res;
}
function eliminate(f){
  S.forces[f].alive=false;
  G().filter(g=>g.force===f&&g.status==='serve').forEach(g=>{g.force=null;g.status='free';});
}
function lineCls(side,pAtt){if(side==='A')return pAtt?'good':'bad';if(side==='D')return pAtt?'bad':'good';return side;}
function playBattle(res,done){
  const pAtt=res.af===S.player;UI.lock=true;
  const win=pAtt?res.win:!res.win;
  openModal(`<h3>⚔️ ${res.from} → ${res.to}</h3><div class="blog" id="blog"></div><div id="bres"></div>
    <button class="btn" id="bskip" onclick="UI.bskip=true">건너뛰기</button>`);
  let i=0;UI.bskip=false;
  const step=()=>{
    const box=$('#blog');if(!box)return;
    while(i<res.L.length){
      const [t,s]=res.L[i++];box.insertAdjacentHTML('beforeend',`<div class="${lineCls(s,pAtt)}">${t}</div>`);
      if(!UI.bskip){box.lastChild.scrollIntoView({block:'nearest'});return setTimeout(step,s==='duel'?900:420);}
    }
    $('#bres').innerHTML=`<div class="result" style="color:${win?'var(--green)':'var(--red)'}">${win?(pAtt?'🏯 승리!':'🛡️ 방어 성공!'):(pAtt?'패배…':'함락당했다…')}</div>
      ${pAtt&&res.captured.length?'<div class="sub" style="text-align:center">포로는 도시 화면에서 등용할 수 있어요</div>':''}
      <button class="btn pri" onclick="closeModal();${done?'UI._bd()':''}">확인</button>`;
    $('#bskip').remove();$('#bres').scrollIntoView({block:'end'});
    if(navigator.vibrate)navigator.vibrate(win?[40,30,80]:120);
  };
  UI._bd=done;step();
}

/* ===================== 자동 내정 ===================== */
function autoAll(){
  const F=S.forces[S.player];let n=0;const found=[],lines=[];
  citiesOf(S.player).forEach(c=>{
    let idle=idleIn(c.id);if(!idle.length)return;
    if(gensAt(c.id,'hidden').length){const g=idle.sort((a,b)=>b.int-a.int).shift();const r=doSearch(g,c);n++;if(r.found)found.push(r.found);}
    if(idle.length&&c.troops<25000&&F.gold>=250){const g=idle.sort((a,b)=>draftAmt(b)-draftAmt(a)).shift();const v=doDraft(g,c);n++;lines.push(`${c.id}: 병사 +${fmt(v)}`);}
    idle.forEach(g=>{
      if(F.gold<50)return;
      const k=c.agri<=c.comm?'agri':'comm';const k2=c[k]>=999?(k==='agri'?'comm':'agri'):k;if(c[k2]>=999)return;
      doDev(g,c,k2);n++;
    });
  });
  after();
  if(!n){toast(F.gold<50?'금이 부족해서 할 수 있는 일이 없습니다':'모든 장수가 이미 행동했습니다');return;}
  const fl=found.map(t=>card(t,`${t.city}에서 발견! 등용해 보세요`,`closeModal();UI.sel='${t.city}';tab('map');cmdRecruit('${t.id}')`)).join('');
  if(found.length&&navigator.vibrate)navigator.vibrate([60,40,120]);
  if(!found.length){toast(`⚡ 장수 ${n}명이 일했습니다`);return;}
  openModal(`<h3>⚡ 자동 내정 완료</h3><div class="sub">장수 ${n}명이 개발·징병·탐색을 했습니다</div>
    <div class="sec"><span>🔍 재야 인재 발견!</span></div>${fl}
    <div class="sub">등용은 직접! 인재를 누르면 바로 등용하러 갑니다 (남은 장수가 있어야 해요)</div>
    <button class="btn" onclick="closeModal()">닫기</button>`);
}

/* ===================== 턴 종료 / AI ===================== */
function endTurn(){
  if(!S)return;
  const news=[],battles=[];
  S.turn++;
  Object.keys(S.forces).filter(f=>f!==S.player&&S.forces[f].alive).sort(()=>Math.random()-.5)
    .forEach(f=>{if(S.forces[f].alive)aiTurn(f,news,battles);});
  const inc=economy(news);
  G().forEach(g=>g.acted=false);
  S.month++;if(S.month>12){S.month=1;S.year++;}
  save();render();
  if(!citiesOf(S.player).length)return gameOver();
  if(Object.values(S.forces).every(f=>f.name===S.player||!f.alive))return victory();
  const showNews=()=>{
    if(!news.length)return toast(`📅 ${S.year}년 ${S.month}월 · 금 +${fmt(inc.g)} · 식량 ${inc.f>=0?'+':''}${fmt(inc.f)}`);
    openModal(`<h3>📜 ${S.year}년 ${S.month}월 소식</h3><div class="sub">금 +${fmt(inc.g)} · 식량 ${inc.f>=0?'+':''}${fmt(inc.f)}</div>
      <div class="blog">${news.map(([t,c])=>`<div class="${c||''}">${t}</div>`).join('')}</div><button class="btn pri" onclick="closeModal()">확인</button>`);
  };
  const playNext=()=>{const b=battles.shift();if(b)playBattle(b,playNext);else showNews();};
  playNext();
}
function economy(news){
  let mine={g:0,f:0};
  Object.values(S.forces).filter(f=>f.alive).forEach(F=>{
    const cs=citiesOf(F.name);
    let g=Math.round(sum(cs,c=>c.comm)*.3),f=Math.round(sum(cs,c=>c.agri)*.6-sum(cs,c=>c.troops)*.02);
    if(S.month===9){f+=Math.round(sum(cs,c=>c.agri)*2);if(F.name===S.player)news.push(['🌾 가을 수확! 식량이 크게 늘었다','good']);}
    F.gold=Math.min(99999,F.gold+g);F.food=Math.min(99999,F.food+f);
    if(F.food<0){F.food=0;cs.forEach(c=>c.troops=Math.floor(c.troops*.92));if(F.name===S.player)news.push(['⚠ 식량 부족! 병사들이 탈영했다','bad']);}
    if(F.name===S.player)mine={g,f};
  });
  return mine;
}
function aiTurn(f,news,battles){
  const F=S.forces[f],cs=citiesOf(f);
  cs.forEach(c=>{
    const gs=gensAt(c.id,'serve',f);
    gs.forEach(g=>{const k=Math.random()<.5?'agri':'comm';c[k]=Math.min(999,c[k]+ri(2,6));});
    if(F.gold>300&&c.troops<10000+gs.length*1800&&gs.length){F.gold-=150;c.troops+=ri(800,1200);}
    if(!gs.length)return;
    gensAt(c.id,'hidden').forEach(g=>{if(Math.random()<.025){g.status='free';}});
    gensAt(c.id,'free').forEach(g=>{if(Math.random()<.07){join(g,f);news.push([`${f}군이 재야의 ${j(g.name,'을','를')} 등용했다 (${stars(rarity(g))})`,'bad']);}});
    gensAt(c.id,'prisoner').forEach(g=>{if(Math.random()<.12){const was=g.prev===S.player;join(g,f);if(was)news.push([`붙잡혀 있던 ${j(g.name,'이','가')} ${f}군에 투항했다…`,'bad']);}});
  });
  // 장수 없는 도시로 한 명 보내기
  cs.forEach(c=>{
    if(gensAt(c.id,'serve',f).length)return;
    for(const n of ADJ[c.id]){if(S.cities[n].owner!==f)continue;const gs=gensAt(n,'serve',f).filter(g=>!isRuler(g));
      if(gs.length>=2){gs.sort((a,b)=>total(a)-total(b))[0].city=c.id;break;}}
  });
  if(S.turn<3)return;
  let best=null;
  citiesOf(f).forEach(c=>{
    const gs=gensAt(c.id,'serve',f);if(!gs.length||c.troops<3000)return;
    const army=gs.slice().sort((a,b)=>power([b])-power([a])).slice(0,3);
    ADJ[c.id].forEach(n=>{
      const t=S.cities[n];if(t.owner===f)return;
      if(t.owner===S.player&&S.turn<8)return;
      const D=t.owner?gensAt(n,'serve',t.owner):[];
      const r=(c.troops*.75*power(army))/((t.troops+1)*1.15*power(D));
      if(r>(t.owner===S.player?1.5:1.2)&&(!best||r>best.r))best={c,t,r,army};
    });
  });
  if(best&&Math.random()<.6){
    const tr=Math.floor(best.c.troops*.75);best.c.troops-=tr;
    const res=battle(f,best.c.id,best.t.id,best.army.map(g=>g.id),tr);
    if(res.df===S.player){battles.push(res);news.push([res.win?`🔥 ${f}군에게 ${j(res.to,'을','를')} 빼앗겼다!`:`🛡️ ${f}군의 ${res.to} 공격을 막아냈다`,res.win?'bad':'good']);}
    else if(res.win)news.push([`${f}군이 ${j(res.to,'을','를')} 점령했다${res.destroyed?` — 💀 ${res.destroyed}군 멸망`:''}`,'']);
  }
}
function gameOver(){
  openModal(`<h3>패망…</h3><div class="sub">${S.player}군의 모든 도시를 잃었습니다.</div><div class="sub">모은 장수: ${S.dex.length} / ${TOTAL}</div>
    <button class="btn pri" onclick="closeModal();localStorage.removeItem(SAVE);showTitle()">처음부터</button>`);UI.lock=true;
}
function victory(){
  openModal(`<div class="result" style="color:var(--gold)">🏆 천하통일!</div><div class="sub" style="text-align:center">${S.player}군이 ${S.year}년 ${S.month}월에 천하를 손에 넣었습니다.<br>도감 ${S.dex.length} / ${TOTAL}</div>
    <button class="btn pri" onclick="closeModal()">계속 둘러보기</button><button class="btn" onclick="closeModal();showSelect();$('#title').classList.add('on')">새 게임</button>`);
}
function openHelp(first){
  openModal(`<h3>${first?`${S.player}군의 천하쟁패가 시작됩니다`:'게임 방법'}</h3><div class="help">
  <p>🎯 <b>목표</b>: 다른 세력을 모두 멸망시키고 천하통일. 그리고 <b>장수 도감</b> 완성!</p>
  <p>👥 <b>장수 1명 = 한 달에 행동 1번.</b> 장수가 많을수록 할 수 있는 일이 늘어요. 지도의 빨간 숫자는 아직 쉬는 장수 수예요.</p>
  <p>🔍 <b>탐색</b>으로 숨은 인재를 찾고 🤝 <b>등용</b>하세요. 실패해도 다시 찾아가면 확률이 올라가요(삼고초려). 군주를 <b>흠모</b>하는 인재는 훨씬 쉽게 와요.</p>
  <p>⭐ 다른 도시의 숨은 인재는 그 도시를 <b>점령</b>해야 찾을 수 있어요. AI도 인재를 데려가니 서두르세요!</p>
  <p>⛓️ 싸워 이기면 적 장수를 <b>포로</b>로 잡아 등용할 수 있어요.</p>
  <p>⚡ <b>바쁠 땐 자동 내정 → 턴 종료</b>. 한 달이 10초면 끝나요. 모든 행동은 자동 저장됩니다.</p>
  <p>🛡️ 처음 몇 달은 적이 공격해 오지 않아요. 그동안 인재를 모으고 병력을 키우세요.</p></div>
  <button class="btn pri" onclick="closeModal()">시작하기</button>`);
}

/* ===================== 시작 ===================== */
(function init(){
  const s=loadSave();
  if(s){S=s;UI.sel=FORCES[S.player][2];if(S.cities[UI.sel].owner!==S.player){const c=citiesOf(S.player)[0];if(c)UI.sel=c.id;}render();}
  else showTitle();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
